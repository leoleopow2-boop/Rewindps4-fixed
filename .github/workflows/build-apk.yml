name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get this repo (it contains patch.zip)
        uses: actions/checkout@v4

      - name: Download the original RewindPS4 Android source and apply the fixes
        run: |
          git clone --depth 1 https://github.com/Ailyth99/RewindPS4_Android.git src
          unzip -o patch.zip -d src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make sure Android SDK 34 is installed
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Build the APK
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: RewindPS4-APK
          path: src/app/build/outputs/apk/debug/*.apk
